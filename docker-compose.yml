services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guzopay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guzopay}
      POSTGRES_DB: ${POSTGRES_DB:-guzopay}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-guzopay} -d ${POSTGRES_DB:-guzopay}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-host=postgres user=guzopay password=guzopay dbname=guzopay port=5432 sslmode=disable}
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  passenger-miniapp:
    build:
      context: ./passenger-miniapp
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080}
    volumes:
      - ./passenger-miniapp:/app
      - passenger_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  driver-pwa:
    build:
      context: ./driver-pwa
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080}
      VITE_VEHICLE_CODE: ${VITE_VEHICLE_CODE:-4A2Q}
    volumes:
      - ./driver-pwa:/app
      - driver_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  passenger_node_modules:
  driver_node_modules:
